# Include inside nginx's http {}. Provision certificates separately.
limit_req_zone $binary_remote_addr zone=tuka_writes:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=tuka_events:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=tuka_reads:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=tuka_connections:10m;
server {
    listen 80;
    server_name tuka.guage.chat;
    access_log off;
    error_log /dev/null crit;
    return 301 https://tuka.guage.chat$request_uri;
}
server {
    listen 443 ssl;
    server_name tuka.guage.chat;
    ssl_certificate /etc/letsencrypt/live/tuka.guage.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuka.guage.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32m;
    client_body_timeout 30s;
    client_body_temp_path /dev/shm/tuka-body;
    proxy_temp_path /dev/shm/tuka-proxy;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_http_version 1.1;
    proxy_read_timeout 115s;
    proxy_send_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn tuka_connections 8;
    location ~ ^/(preview|regenerate-slide|render|regenerate-style|download-all|upload-image|check-sensitive)$ {
        limit_req zone=tuka_writes burst=2 nodelay;
        proxy_pass http://127.0.0.1:5001;
    }
    location = /api/models {
        limit_req zone=tuka_writes burst=2 nodelay;
        proxy_pass http://127.0.0.1:5001;
    }
    location = /api/events {
        limit_req zone=tuka_events burst=10 nodelay;
        proxy_pass http://127.0.0.1:5001;
    }
    location / {
        limit_req zone=tuka_reads burst=60 nodelay;
        proxy_pass http://127.0.0.1:5001;
    }
}
